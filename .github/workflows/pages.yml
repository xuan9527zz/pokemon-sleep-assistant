name: Deploy Pokemon Sleep Assistant to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Test public checkout
        run: |
          for test in scripts/*.test.js; do node "$test"; done

      - name: Prepare public site
        run: |
          mkdir -p "$RUNNER_TEMP/pokemon-sleep-site"
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./scripts' \
            --exclude='./docs' \
            --exclude='./tmp' \
            --exclude='./box-scores.generated.js' \
            --exclude='./team-production.generated.js' \
            . | tar -xf - -C "$RUNNER_TEMP/pokemon-sleep-site"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pokemon-sleep-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
